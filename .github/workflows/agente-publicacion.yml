name: Agente de publicación (Groq)

on:
  # Corre dos veces por semana: lunes y jueves a las 22:00 UTC.
  schedule:
    - cron: '0 22 * * 1,4'
  workflow_dispatch:
    inputs:
      modelo:
        description: 'Modelo a probar primero (vacio = el orden de agente/llm-chain.json). Si falla, sigue la cadena.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: agente-publicacion
  cancel-in-progress: false

jobs:
  agente:
    name: Investigar y proponer páginas (sin bash para el modelo)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pasos 1 (investigar con busqueda web) y 2 (estructurar en JSON) con una
      # cadena de LLMs gratis: si un modelo se queda sin cuota o falla, se pasa
      # al siguiente (otro modelo de Groq, compound, Gemini, Cerebras,
      # OpenRouter). El orden y los modelos estan en agente/llm-chain.json; los
      # proveedores sin API key en los secrets se saltan solos.
      # El modelo solo devuelve texto: no tiene Bash, no toca archivos y no ve
      # el repo mas alla de lo que le pegamos en el prompt (slugs + titulos).
      # Si TODOS se quedan sin cuota, la corrida termina en verde sin paginas
      # nuevas (skip=true) y se avisa en el resumen.
      - name: Investigar y estructurar (cadena de LLMs gratis)
        id: llm
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELO: ${{ inputs.modelo }}
        run: node scripts/llm-chain.js

      # Limpia la respuesta, la normaliza, y le pone tope de 3 items.
      - name: Procesar y validar la respuesta del modelo
        if: steps.llm.outputs.skip != 'true'
        run: |
          node scripts/process-agent-output.js \
            "$RUNNER_TEMP/respuesta-cruda.json" \
            "$RUNNER_TEMP/agent-output.json"

      # add-pages.js ya corre validateItem() de guard.js por cada item, y
      # nunca pisa ni borra páginas existentes.
      - name: Agregar páginas propuestas a data/pages.json
        if: steps.llm.outputs.skip != 'true'
        run: node scripts/add-pages.js "$RUNNER_TEMP/agent-output.json"

      - name: Subir log del agente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agente-log
          path: ${{ runner.temp }}/agente-log.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Subir snapshot de data
        uses: actions/upload-artifact@v4
        with:
          name: agente-data
          path: data/
          retention-days: 1
          if-no-files-found: error

  validar-y-publicar:
    name: Validar y publicar en runner limpio
    needs: agente
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout limpio del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar identidad de git
        run: |
          git config user.name "agente-leonida"
          git config user.email "agente-leonida@users.noreply.github.com"

      - name: Descargar data generada por el agente
        uses: actions/download-artifact@v4
        with:
          name: agente-data
          path: ${{ runner.temp }}/agente-data

      - name: Validar y aplicar snapshot de data
        shell: bash
        run: |
          INCOMING="$RUNNER_TEMP/agente-data"

          BAD_PATHS="$(
            find "$INCOMING" -mindepth 1 \
              \( ! -type f -o ! -name '*.json' \) \
              -print
          )"

          if [ -n "$BAD_PATHS" ]; then
            echo "::error::El artifact contiene rutas no permitidas:"
            printf '%s\n' "$BAD_PATHS"
            exit 1
          fi

          if [ ! -f "$INCOMING/pages.json" ]; then
            echo "::error::Falta data/pages.json en la salida del agente"
            exit 1
          fi

          cp "$INCOMING"/*.json data/

      - name: Freno 1 — Guard del agente
        run: node scripts/guard.js --agent

      - name: Freno 2 — Build
        run: npm run build

      - name: Freno 3 — Archivos críticos y sitemap
        shell: bash
        run: |
          for file in \
            public/googlebce07ec590b3fc8d.html \
            public/google2f81ceee882d8fa6.html
          do
            if [ ! -f "$file" ]; then
              echo "::error::Falta archivo crítico: $file"
              exit 1
            fi
          done

          if [ ! -f dist/sitemap.xml ]; then
            echo "::error::Falta dist/sitemap.xml"
            exit 1
          fi

          URL_COUNT="$(grep -o '<loc>' dist/sitemap.xml | wc -l || true)"
          URL_COUNT="$(echo "$URL_COUNT" | tr -d '[:space:]')"

          if [ "${URL_COUNT:-0}" -lt 15 ]; then
            echo "::error::dist/sitemap.xml tiene solo ${URL_COUNT:-0} URLs; se requieren al menos 15"
            exit 1
          fi

          echo "Sitemap OK: $URL_COUNT URLs"

      - name: Commit y push de contenido
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- data/ && \
             [ -z "$(git ls-files --others --exclude-standard -- data/)" ]; then
            echo "No hay cambios nuevos ni modificados en data/. Corrida válida sin commit."
            exit 0
          fi

          SLUGS="$(node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");
          let beforeItems = [];
          try {
            const raw = execSync(`git show ${process.env.GITHUB_SHA}:data/pages.json`, { encoding: "utf8" });
            beforeItems = JSON.parse(raw).items || [];
          } catch (_) {}
          const before = new Map(beforeItems.map((p) => [p.slug, JSON.stringify(p)]));
          const after = JSON.parse(fs.readFileSync("data/pages.json", "utf8")).items || [];
          const touched = after.filter((p) => before.get(p.slug) !== JSON.stringify(p)).map((p) => p.slug);
          process.stdout.write(touched.join(" ") || "update");
          ')"

          git add data/
          git commit -m "content: $SLUGS"

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # main puede haber avanzado mientras corria el agente: se rebasa sobre
          # lo ultimo y se reintenta. Solo cambia data/, asi que no deberia haber conflictos.
          for intento in 1 2 3 4 5; do
            git fetch "$REMOTE" main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::Conflicto al rebasar sobre main. Corre el workflow de nuevo."
              exit 1
            fi

            # Revalida sobre el main actualizado antes de publicar
            node scripts/guard.js --agent
            npm run build

            if git push "$REMOTE" HEAD:main; then
              echo "Push OK (intento $intento)"
              exit 0
            fi
            echo "Push rechazado (intento $intento), reintentando..."
            sleep $((intento * 3))
          done

          echo "::error::No se pudo hacer push tras 5 intentos"
          exit 1
